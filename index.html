<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vortex Downloader - قص وتحميل الفيديو</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient-start: var(--tg-theme-bg-color, #0f172a);
    --bg-gradient-end: #090d16;
    --text-primary: var(--tg-theme-text-color, #f8fafc);
    --text-muted: var(--tg-theme-hint-color, #94a3b8);
    
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    
    --accent-blue: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.35);
    --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
    --accent-gradient-hover: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
    
    --danger-red: #ef4444;
    --danger-gradient: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
    
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.06);
    --radius-xl: 20px;
    --radius-lg: 14px;
    --radius-md: 10px;
  }

  * { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    outline: none;
  }

  html, body { 
    margin: 0; 
    padding: 0;
    background: var(--bg-gradient-end);
    background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #090d16 100%);
    color: var(--text-primary);
    font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
    min-height: 100vh;
    overflow-x: hidden;
  }

  body { 
    padding: 16px 16px 28px; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 480px;
    margin: 0 auto;
  }

  .hidden { display: none !important; }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
    50% { box-shadow: 0 0 25px rgba(59, 130, 246, 0.5); }
  }

  /* Status Screens */
  .center { 
    min-height: 75vh; 
    display: flex; 
    flex-direction: column;
    align-items: center; 
    justify-content: center; 
    text-align: center; 
    gap: 16px; 
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .spinner-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .spinner { 
    width: 56px; 
    height: 56px; 
    border-radius: 50%;
    border: 3.5px solid rgba(255, 255, 255, 0.08); 
    border-top-color: var(--accent-blue);
    animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.1, 0.8) infinite; 
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hint { color: var(--text-muted); font-size: 14px; line-height: 1.6; font-weight: 500; }
  .err { color: #f87171; font-size: 15px; line-height: 1.6; font-weight: 600; }

  /* Media Player Container */
  .player-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-xl);
    padding: 12px;
    box-shadow: var(--card-shadow);
    margin-bottom: 16px;
  }

  video { 
    width: 100%; 
    max-height: 36vh; 
    background: #000; 
    border-radius: var(--radius-lg); 
    display: block; 
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    object-fit: contain;
  }

  #title { 
    margin: 12px 6px 4px; 
    font-size: 14px; 
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }

  /* Slider UI */
  .slider-box {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-xl);
    padding: 18px 16px 12px;
    box-shadow: var(--card-shadow);
    margin-bottom: 16px;
  }

  .slider { 
    direction: ltr; 
    padding: 16px 10px 8px; 
    user-select: none; 
    -webkit-user-select: none; 
  }

  .track { 
    position: relative; 
    height: 10px; 
    border-radius: 99px; 
    background: rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
  }

  .fill { 
    position: absolute; 
    top: 0; 
    bottom: 0; 
    background: var(--accent-gradient); 
    border-radius: 99px; 
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .playhead { 
    position: absolute; 
    top: -5px; 
    bottom: -5px; 
    width: 3px; 
    background: #ffffff;
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
    border-radius: 2px; 
    pointer-events: none; 
    z-index: 1;
  }

  .thumb { 
    position: absolute; 
    top: 50%; 
    width: 28px; 
    height: 28px; 
    margin: -14px 0 0 -14px;
    border-radius: 50%; 
    background: #ffffff; 
    border: 3.5px solid var(--accent-blue);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
    touch-action: none; 
    cursor: grab; 
    z-index: 2; 
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .thumb::after {
    content: "";
    position: absolute;
    inset: 5px;
    background: var(--accent-blue);
    border-radius: 50%;
  }

  .thumb.drag { 
    transform: scale(1.2); 
    cursor: grabbing;
  }

  #tE { 
    border-color: var(--danger-red); 
  }
  #tE::after {
    background: var(--danger-red);
  }

  .scale { 
    direction: ltr; 
    display: flex; 
    justify-content: space-between;
    font-size: 13px; 
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    color: var(--text-muted); 
    padding: 4px 6px 0; 
  }

  /* Control Boxes */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }

  .box { 
    background: var(--card-bg); 
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-xl); 
    padding: 12px; 
    text-align: center; 
    box-shadow: var(--card-shadow);
  }

  .lbl { 
    font-size: 13px; 
    font-weight: 700;
    color: var(--text-muted); 
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .val { 
    font-size: 24px; 
    font-weight: 800; 
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 6px 0 10px; 
    direction: ltr; 
    color: var(--text-primary);
    letter-spacing: 0.5px;
  }

  .mini { display: flex; gap: 6px; justify-content: center; }

  .mini button { 
    flex: 1; 
    border: 1px solid var(--glass-border); 
    border-radius: var(--radius-md); 
    padding: 8px 0; 
    font-size: 13px;
    font-weight: 700;
    background: var(--glass-bg); 
    color: var(--text-primary); 
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .mini button:active { 
    transform: scale(0.94);
    background: rgba(255, 255, 255, 0.1);
  }

  /* Button Styles */
  button.ghost { 
    width: 100%; 
    padding: 14px; 
    border: 1px solid var(--card-border); 
    border-radius: var(--radius-lg);
    font-size: 15px; 
    font-weight: 700;
    background: var(--card-bg); 
    color: var(--text-primary); 
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.2s ease;
    box-shadow: var(--card-shadow);
  }

  button.ghost:active {
    transform: scale(0.98);
    background: rgba(255, 255, 255, 0.08);
  }

  button.primary { 
    width: 100%; 
    margin-top: 10px; 
    padding: 16px; 
    border: 0; 
    border-radius: var(--radius-lg);
    font-size: 16px; 
    font-weight: 800; 
    background: var(--accent-gradient); 
    color: #ffffff; 
    cursor: pointer;
    box-shadow: 0 8px 20px var(--accent-glow);
    transition: all 0.2s ease;
  }

  button.primary:active {
    transform: scale(0.98);
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  button:disabled { 
    opacity: 0.5; 
    cursor: not-allowed;
    transform: none !important;
  }

  /* Home Screen Styles */
  .brand-logo {
    width: 80px;
    height: 80px;
    margin: 10px auto 16px;
    background: var(--accent-gradient);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    box-shadow: 0 12px 28px var(--accent-glow);
    animation: pulseGlow 3s infinite ease-in-out;
  }

  .home-card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-xl);
    padding: 24px 18px;
    box-shadow: var(--card-shadow);
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #url { 
    width: 100%; 
    margin: 18px 0 12px; 
    padding: 16px; 
    border-radius: var(--radius-lg); 
    font-size: 15px; 
    border: 1px solid var(--glass-border); 
    background: rgba(15, 23, 42, 0.6); 
    color: #ffffff; 
    transition: all 0.2s ease;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }

  #url:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px var(--accent-glow), inset 0 2px 4px rgba(0,0,0,0.3);
  }

  .home-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #info { 
    margin: 14px 0 4px; 
    text-align: center; 
    font-size: 13.5px; 
    color: var(--text-muted); 
    line-height: 1.6; 
  }

  #formErr, #homeErr { 
    color: #f87171; 
    text-align: center; 
    margin-top: 12px; 
    font-size: 14px; 
    font-weight: 600;
  }

  #main {
    animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
</style>
</head>
<body>

<!-- تحميل -->
<div id="loading" class="center hidden">
  <div class="spinner-wrapper">
    <div class="spinner"></div>
  </div>
  <div><b style="font-size: 17px;">جاري تجهيز الفيديو...</b></div>
  <div class="hint">قد يستغرق الأمر من بضع ثوانٍ إلى دقيقة حسب حجم الفيديو</div>
</div>

<!-- الشاشة الرئيسية (عند الفتح من زر Open بدون رابط) -->
<div id="home" class="hidden">
  <div class="home-card">
    <div class="brand-logo">📥</div>
    <h2 style="text-align:center; margin:0 0 6px; font-size: 22px; font-weight: 800;">Vortex downloader</h2>
    <div class="hint" style="text-align:center">حمّل فيديو أو صوت، أو قص مقطع من أي رابط بسرعة فائقة</div>
    
    <div id="stepUrl" style="margin-top: 10px;">
      <input id="url" type="url" dir="ltr" placeholder="https://..." autocomplete="off">
      <div class="home-actions">
        <button class="ghost" id="paste">📋 لصق من الحافظة</button>
        <button class="primary" id="next">متابعة ➔</button>
      </div>
    </div>
    
    <div id="stepPick" class="hidden home-actions" style="margin-top: 16px;">
      <button class="primary" id="pV">🎬 تحميل فيديو (HD)</button>
      <button class="ghost" id="pA">🎵 تحميل صوت فقط (MP3)</button>
      <button class="ghost" id="pT">✂️ قص مقطع (بالسلايدر)</button>
    </div>
    
    <div id="homeErr"></div>
  </div>
</div>

<!-- خطأ -->
<div id="failed" class="center hidden">
  <div style="font-size:54px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));">⚠️</div>
  <div class="err" id="failMsg"></div>
</div>

<!-- الواجهة الرئيسية -->
<div id="main" class="hidden">
  <div class="player-card">
    <video id="video" playsinline preload="metadata" controls></video>
    <div id="title"></div>
  </div>

  <div class="slider-box">
    <div class="slider" id="slider">
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="playhead" id="playhead"></div>
        <div class="thumb" id="tS"></div>
        <div class="thumb" id="tE"></div>
      </div>
    </div>
    <div class="scale"><span>0:00</span><span id="total">0:00</span></div>
  </div>

  <div class="row">
    <div class="box">
      <div class="lbl">🟢 البداية</div>
      <div class="val" id="vS">0:00</div>
      <div class="mini">
        <button id="sM">−1ث</button>
        <button id="sP">+1ث</button>
        <button id="sH">📍 هنا</button>
      </div>
    </div>
    <div class="box">
      <div class="lbl">🔴 النهاية</div>
      <div class="val" id="vE">0:00</div>
      <div class="mini">
        <button id="eM">−1ث</button>
        <button id="eP">+1ث</button>
        <button id="eH">📍 هنا</button>
      </div>
    </div>
  </div>

  <button class="ghost" id="preview">▶ معاينة المقطع</button>
  <div id="info"></div>
  <button class="primary" id="go">✂️ قص وإرسال</button>
  <div id="formErr"></div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const $ = (id) => document.getElementById(id);
  let key = new URLSearchParams(location.search).get('k');
  const video = $('video'), track =$('track');

  let dur = 0, start = 0, end = 0, previewing = false, uiStarted = false;

  const pad = (n) => String(n).padStart(2, '0');
  function fmt(t) {
    t = Math.max(0, Math.round(t));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  async function post(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg ? tg.initData : '' },
      body: JSON.stringify(body),
    });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    j.httpStatus = r.status;
    return j;
  }

  function fail(msg) {
    $('loading').classList.add('hidden');$('main').classList.add('hidden');
    $('home').classList.add('hidden');$('failMsg').textContent = msg;
    $('failed').classList.remove('hidden');
  }

  /* ---------- ضبط القيم ---------- */
  function setStart(t) {
    t = Math.round(t);
    t = Math.min(t, end - 1);
    start = Math.max(0, t);
  }
  function setEnd(t) {
    t = Math.round(t);
    if (dur - t < 1) t = dur;          // الالتصاق بنهاية الفيديو
    t = Math.min(t, dur);
    end = Math.max(t, start + 1);
  }
  function seek(t) {
    try { video.currentTime = t; } catch (e) {}
  }

  function render() {
    const pS = (start / dur) * 100, pE = (end / dur) * 100;
    $('tS').style.left = pS + '\%';$('tE').style.left = pE + '%';
    $('fill').style.left = pS + '\%';$('fill').style.width = (pE - pS) + '%';
    $('vS').textContent = fmt(start);$('vE').textContent = fmt(end);
    const len = end - start;
    let info = `مدة المقطع المُحدد: <b style="color:var(--text-primary);">${fmt(len)}</b>`;
    if (len > 600) info += '<br><span style="color:#f59e0b; font-size: 12px;">⚠️ المقاطع الطويلة تُضغط تلقائياً لتناسب حد تيليجرام (50MB)</span>';
    $('info').innerHTML = info;
  }

  /* ---------- السحب ---------- */
  function bindThumb(el, which) {
    el.addEventListener('pointerdown', (e) => {
      el.setPointerCapture(e.pointerId);
      el.classList.add('drag');
      e.preventDefault();
    });
    el.addEventListener('pointermove', (e) => {
      if (!el.hasPointerCapture(e.pointerId)) return;
      const r = track.getBoundingClientRect();
      let t = ((e.clientX - r.left) / r.width) * dur;
      t = Math.min(Math.max(t, 0), dur);
      if (which === 's') { setStart(t); seek(start); }
      else { setEnd(t); seek(end); }
      render();
    });
    const up = () => el.classList.remove('drag');
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }

  /* ---------- الأزرار ---------- */
  function bindButtons() {
    $('sM').onclick = () => { setStart(start - 1); seek(start); render(); };$('sP').onclick = () => { setStart(start + 1); seek(start); render(); };
    $('eM').onclick = () => { setEnd(end - 1); seek(end); render(); };$('eP').onclick = () => { setEnd(end + 1); seek(end); render(); };
    $('sH').onclick = () => { setStart(video.currentTime \vert{}\vert{} 0); render(); };$('eH').onclick = () => { setEnd(video.currentTime || 0); render(); };

    $('preview').onclick = () => {
      if (previewing) { video.pause(); return; }
      seek(start);
      previewing = true;
      $('preview').textContent = '⏸ إيقاف المعاينة';
      const p = video.play();
      if (p && p.catch) p.catch(() => { previewing = false; updatePreviewBtn(); });
    };

    $('go').onclick = async () => {
      const b = $('go');$('formErr').textContent = '';
      b.disabled = true;
      b.textContent = '⏳ جاري الإرسال...';
      try {
        const r = await post('/api/trim', { key: key, start: start, end: end });
        if (r.ok) {
          b.textContent = '✅ تم! ستصلك النتيجة في المحادثة';
          setTimeout(() => { if (tg) tg.close(); }, 900);
          return;
        }
        throw new Error(r.error || 'error');
      } catch (e) {
        b.disabled = false;
        b.textContent = '✂️ قص وإرسال';
        $('formErr').textContent = 'تعذّر بدء القص، حاول مرة أخرى.';
      }
    };
  }

  function updatePreviewBtn() {
    $('preview').textContent = previewing ? '⏸ إيقاف المعاينة' : '▶ معاينة المقطع';
  }

  video.addEventListener('timeupdate', () => {
    if (dur) $('playhead').style.left = (video.currentTime / dur) * 100 + '%';
    if (previewing && video.currentTime >= end) { video.pause(); }
  });
  video.addEventListener('pause', () => { previewing = false; updatePreviewBtn(); });

  /* ---------- بدء الواجهة ---------- */
  function startUI(info) {
    if (uiStarted) return;
    const d = (isFinite(video.duration) && video.duration > 0) ? video.duration : info.duration;
    if (!d) return fail('تعذّر معرفة مدة الفيديو.');
    uiStarted = true;
    dur = d;
    start = 0;
    end = Math.min(dur, 60);
    if (end < 1) end = dur;
    $('title').textContent = info.title \vert{}\vert{} '';$('total').textContent = fmt(dur);
    bindThumb($('tS'), 's');
    bindThumb($('tE'), 'e');
    bindButtons();
    $('loading').classList.add('hidden');$('main').classList.remove('hidden');
    render();
  }

  function ready(info) {
    video.addEventListener('loadedmetadata', () => startUI(info), { once: true });
    video.addEventListener('error', () => {
      // المعاينة غير مدعومة (صيغة الفيديو) لكن القص ما زال ممكناً بالأزرار
      startUI(info);
      $('formErr').textContent = 'المعاينة غير مدعومة لهذا الفيديو، استخدم الأزرار لضبط الوقت.';
    }, { once: true });
    video.src = '/media/' + encodeURIComponent(key);
    video.load();
  }

  async function poll() {
    try {
      const r = await fetch('/api/status?k=' + encodeURIComponent(key));
      const j = await r.json();
      if (j.state === 'ready') return ready(j);
      if (j.state === 'error') return fail(j.error || 'حدث خطأ أثناء تحميل الفيديو.');
      if (j.state === 'expired') return fail('انتهت صلاحية الطلب. أرسل الرابط للبوت مرة أخرى.');
    } catch (e) { /* نعيد المحاولة */ }
    setTimeout(poll, 1500);
  }

  async function begin() {
    $('loading').classList.remove('hidden');
    const r = await post('/api/prepare', { key: key });
    if (!r.ok) {
      const msgs = {
        expired: 'انتهت صلاحية هذا الطلب (أو أُعيد تشغيل البوت). أرسل الرابط للبوت مرة أخرى واضغط الزر الجديد.',
        bad_signature: 'فشل التحقق من تيليجرام. افتح الصفحة من زر البوت داخل تيليجرام.',
        wrong_user: 'هذا الطلب يخص مستخدماً آخر.',
      };
      return fail(msgs[r.error] || 'تعذّر فتح الطلب. أرسل الرابط للبوت مرة أخرى.');
    }
    poll();
  }

  /* ---------- الشاشة الرئيسية ---------- */
  function startHome() {
    $('home').classList.remove('hidden');
    const err = (m) => { $('homeErr').textContent = m \vert{}\vert{} ''; };$('paste').onclick = () => {
      const put = (t) => { if (t) $('url').value = String(t).trim(); };
      if (tg && tg.readTextFromClipboard) tg.readTextFromClipboard(put);
      else if (navigator.clipboard) navigator.clipboard.readText().then(put).catch(() => {});
    };
    $('next').onclick = async () => {
      const url = $('url').value.trim();
      err('');
      if (!/^https?:\/\//i.test(url)) return err('الصق رابطاً صحيحاً يبدأ بـ https://');
      const b = $('next'); b.disabled = true; b.textContent = '⏳ جاري الفحص...';
      const r = await post('/api/create', { url: url });
      b.disabled = false; b.textContent = 'متابعة ➔';
      if (!r.ok) {
        const m = { bad_url: 'الرابط غير صالح.', too_many: 'عندك طلبات كثيرة قيد المعالجة، انتظر قليلاً.',
                    bad_signature: 'افتح الصفحة من داخل تيليجرام.' };
        return err(m[r.error] || 'تعذّر قبول الرابط، حاول مرة أخرى.');
      }
      key = r.key;
      $('stepUrl').classList.add('hidden');$('stepPick').classList.remove('hidden');
    };
    const dl = async (action) => {
      err('');
      ['pV', 'pA', 'pT'].forEach((i) => { $(i).disabled = true; });
      const r = await post('/api/download', { key: key, action: action });
      if (r.ok) {
        $('stepPick').innerHTML = '<div class="center"><div style="font-size:54px">✅</div>' +
          '<div><b style="font-size:18px;">تم! ستصلك النتيجة في المحادثة</b></div></div>';
        setTimeout(() => { if (tg) tg.close(); }, 1200);
      } else {
        ['pV', 'pA', 'pT'].forEach((i) => { $(i).disabled = false; });
        err('تعذّر بدء التحميل، حاول مرة أخرى.');
      }
    };
    $('pV').onclick = () => dl('video');$('pA').onclick = () => dl('audio');
    $('pT').onclick = () => {$('home').classList.add('hidden'); begin(); };
  }

  if (key) begin(); else startHome();
})();
</script>
</body>
</html>

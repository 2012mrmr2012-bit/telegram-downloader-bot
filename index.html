<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>قص الفيديو</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #14151a);
    --hint: var(--tg-theme-hint-color, #7c8091);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f8);
    --acc: #5b5bf0;          /* البداية والأزرار */
    --acc-text: #ffffff;
    --end: #f0476b;          /* النهاية */
    --line: rgba(128,128,140,.22);
    --danger: #e5484d;
    --r: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "IBM Plex Sans Arabic", -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body { padding: 14px 16px 28px; min-height: 100vh; line-height: 1.55; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; transition: transform .12s, opacity .12s; }
  button:active:not(:disabled) { transform: scale(.975); }
  button:disabled { opacity: .5; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  /* حالات التحميل والخطأ */
  .center { min-height: 78vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 0 12px; }
  .spinner { width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--acc); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: var(--hint); font-size: 14px; }
  .err { color: var(--danger); font-size: 15px; }

  /* الرئيسية */
  .brand { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 26px 0 22px; text-align: center; }
  .logo { width: 62px; height: 62px; border-radius: 20px; background: var(--acc); color: var(--acc-text);
    display: grid; place-items: center; }
  .brand h2 { margin: 4px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -.2px; }
  #url { width: 100%; padding: 15px 16px; border-radius: var(--r); font: inherit; font-size: 16px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--text); }
  #url:focus { border-color: var(--acc); outline: none; }
  #pick-title { font-size: 14px; color: var(--hint); margin: 4px 2px 12px; word-break: break-all; }

  button.primary, button.ghost, button.opt { width: 100%; margin-top: 10px; border: 0; border-radius: var(--r); }
  button.primary { padding: 15px; font-size: 17px; font-weight: 700; background: var(--acc); color: var(--acc-text); }
  button.ghost { padding: 13px; font-size: 15px; font-weight: 500; background: var(--card); color: var(--text); }
  button.opt { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: right;
    background: var(--card); color: var(--text); font-size: 16px; font-weight: 600; border: 1.5px solid transparent; }
  button.opt small { display: block; font-size: 12.5px; font-weight: 400; color: var(--hint); }
  button.opt .ic { font-size: 24px; width: 40px; height: 40px; border-radius: 12px; background: var(--bg);
    display: grid; place-items: center; flex: none; }
  button.opt:hover { border-color: var(--acc); }

  /* المحرر */
  video { width: 100%; max-height: 38vh; background: #000; border-radius: var(--r); display: block; }
  #title { margin: 10px 2px 0; font-size: 13px; color: var(--hint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* شريط القص: شريط فيلم، المنطقة المختارة مضاءة والباقي معتّم */
  .slider { direction: ltr; padding: 20px 14px 4px; user-select: none; -webkit-user-select: none; }
  .track { position: relative; height: 52px; border-radius: 10px; background: var(--card);
    background-image: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 12px);
    box-shadow: inset 0 0 0 1px var(--line); }
  .fill { position: absolute; top: 0; bottom: 0; background: rgba(91,91,240,.22);
    border-top: 3px solid var(--acc); border-bottom: 3px solid var(--end); }
  .playhead { position: absolute; top: -7px; bottom: -7px; width: 2px; background: var(--text);
    opacity: .7; border-radius: 1px; pointer-events: none; z-index: 1; }
  .thumb { position: absolute; top: -5px; bottom: -5px; width: 16px; margin-left: -8px; z-index: 2;
    border-radius: 7px; background: var(--acc); touch-action: none; cursor: grab;
    display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
  .thumb::after { content: ""; width: 2px; height: 18px; border-radius: 1px; background: rgba(255,255,255,.85); }
  .thumb::before { content: ""; position: absolute; inset: -6px -14px; }
  .thumb.drag { transform: scaleX(1.25); }
  #tE { background: var(--end); }
  .scale { direction: ltr; display: flex; justify-content: space-between;
    font-size: 12px; color: var(--hint); padding: 8px 14px 0; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .box { background: var(--card); border-radius: var(--r); padding: 12px 10px; text-align: center; }
  .box.s { border-top: 3px solid var(--acc); }
  .box.e { border-top: 3px solid var(--end); }
  .lbl { font-size: 13px; color: var(--hint); font-weight: 500; }
  .val { font-size: 28px; font-weight: 700; margin: 0 0 8px; direction: ltr; font-variant-numeric: tabular-nums; }
  .mini { display: flex; gap: 6px; }
  .mini button { flex: 1; border: 0; border-radius: 10px; padding: 9px 2px; font-size: 13px;
    background: var(--bg); color: var(--text); }
  #info { margin-top: 14px; text-align: center; font-size: 14px; color: var(--hint); }
  #info b { color: var(--text); }
  #formErr, #homeErr { color: var(--danger); text-align: center; margin-top: 10px; font-size: 14px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- تحميل -->
<div id="loading" class="center hidden">
  <div class="spinner"></div>
  <div><b>جاري تجهيز الفيديو...</b></div>
  <div class="hint">قد يستغرق الأمر من بضع ثوانٍ إلى دقيقة حسب حجم الفيديو</div>
</div>

<!-- الشاشة الرئيسية (عند الفتح من زر Open بدون رابط) -->
<div id="home" class="hidden">
  <div class="brand">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg></div>
    <h2>Vortex downloader</h2>
    <div class="hint">حمّل فيديو أو صوت، أو قص مقطع من أي رابط</div>
  </div>
  <div id="stepUrl">
    <input id="url" type="url" dir="ltr" placeholder="الصق الرابط هنا" autocomplete="off">
    <button class="ghost" id="paste">📋 لصق من الحافظة</button>
    <button class="primary" id="next">متابعة</button>
  </div>
  <div id="stepPick" class="hidden">
    <div id="pick-title">اختر ما تريد تحميله</div>
    <button class="opt" id="pV"><span class="ic">🎬</span><span>فيديو<small>أعلى جودة متاحة</small></span></button>
    <button class="opt" id="pA"><span class="ic">🎵</span><span>صوت فقط<small>ملف MP3</small></span></button>
    <button class="opt" id="pT"><span class="ic">✂️</span><span>قص مقطع<small>حدّد البداية والنهاية بالسلايدر</small></span></button>
  </div>
  <div id="homeErr"></div>
</div>

<!-- خطأ -->
<div id="failed" class="center hidden">
  <div style="font-size:42px">😕</div>
  <div class="err" id="failMsg"></div>
</div>

<!-- الواجهة الرئيسية -->
<div id="main" class="hidden">
  <video id="video" playsinline preload="metadata" controls></video>
  <div id="title"></div>

  <div class="slider" id="slider">
    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="playhead" id="playhead"></div>
      <div class="thumb" id="tS"></div>
      <div class="thumb" id="tE"></div>
    </div>
  </div>
  <div class="scale"><span>0:00</span><span id="total">0:00</span></div>

  <div class="row">
    <div class="box s">
      <div class="lbl">البداية</div>
      <div class="val" id="vS">0:00</div>
      <div class="mini">
        <button id="sM">−1ث</button>
        <button id="sP">+1ث</button>
        <button id="sH">📍 هنا</button>
      </div>
    </div>
    <div class="box e">
      <div class="lbl">النهاية</div>
      <div class="val" id="vE">0:00</div>
      <div class="mini">
        <button id="eM">−1ث</button>
        <button id="eP">+1ث</button>
        <button id="eH">📍 هنا</button>
      </div>
    </div>
  </div>

  <button class="ghost" id="preview">▶ معاينة المقطع</button>
  <div id="info"></div>
  <button class="primary" id="go">✂️ قص وإرسال</button>
  <div id="formErr"></div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const $ = (id) => document.getElementById(id);
  let key = new URLSearchParams(location.search).get('k');
  const video = $('video'), track = $('track');

  let dur = 0, start = 0, end = 0, previewing = false, uiStarted = false;

  const pad = (n) => String(n).padStart(2, '0');
  function fmt(t) {
    t = Math.max(0, Math.round(t));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  async function post(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg ? tg.initData : '' },
      body: JSON.stringify(body),
    });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    j.httpStatus = r.status;
    return j;
  }

  function fail(msg) {
    $('loading').classList.add('hidden');
    $('main').classList.add('hidden');
    $('home').classList.add('hidden');
    $('failMsg').textContent = msg;
    $('failed').classList.remove('hidden');
  }

  /* ---------- ضبط القيم ---------- */
  function setStart(t) {
    t = Math.round(t);
    t = Math.min(t, end - 1);
    start = Math.max(0, t);
  }
  function setEnd(t) {
    t = Math.round(t);
    if (dur - t < 1) t = dur;          // الالتصاق بنهاية الفيديو
    t = Math.min(t, dur);
    end = Math.max(t, start + 1);
  }
  function seek(t) {
    try { video.currentTime = t; } catch (e) {}
  }

  function render() {
    const pS = (start / dur) * 100, pE = (end / dur) * 100;
    $('tS').style.left = pS + '%';
    $('tE').style.left = pE + '%';
    $('fill').style.left = pS + '%';
    $('fill').style.width = (pE - pS) + '%';
    $('vS').textContent = fmt(start);
    $('vE').textContent = fmt(end);
    const len = end - start;
    let info = `مدة المقطع: <b>${fmt(len)}</b>`;
    if (len > 600) info += '<br>المقاطع الطويلة تُضغط تلقائياً لتناسب حد تيليجرام (50MB)';
    $('info').innerHTML = info;
  }

  /* ---------- السحب ---------- */
  function bindThumb(el, which) {
    el.addEventListener('pointerdown', (e) => {
      el.setPointerCapture(e.pointerId);
      el.classList.add('drag');
      e.preventDefault();
    });
    el.addEventListener('pointermove', (e) => {
      if (!el.hasPointerCapture(e.pointerId)) return;
      const r = track.getBoundingClientRect();
      let t = ((e.clientX - r.left) / r.width) * dur;
      t = Math.min(Math.max(t, 0), dur);
      if (which === 's') { setStart(t); seek(start); }
      else { setEnd(t); seek(end); }
      render();
    });
    const up = () => el.classList.remove('drag');
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }

  /* ---------- الأزرار ---------- */
  function bindButtons() {
    $('sM').onclick = () => { setStart(start - 1); seek(start); render(); };
    $('sP').onclick = () => { setStart(start + 1); seek(start); render(); };
    $('eM').onclick = () => { setEnd(end - 1); seek(end); render(); };
    $('eP').onclick = () => { setEnd(end + 1); seek(end); render(); };
    $('sH').onclick = () => { setStart(video.currentTime || 0); render(); };
    $('eH').onclick = () => { setEnd(video.currentTime || 0); render(); };

    $('preview').onclick = () => {
      if (previewing) { video.pause(); return; }
      seek(start);
      previewing = true;
      $('preview').textContent = '⏸ إيقاف المعاينة';
      const p = video.play();
      if (p && p.catch) p.catch(() => { previewing = false; updatePreviewBtn(); });
    };

    $('go').onclick = async () => {
      const b = $('go');
      $('formErr').textContent = '';
      b.disabled = true;
      b.textContent = '⏳ جاري الإرسال...';
      try {
        const r = await post('/api/trim', { key: key, start: start, end: end });
        if (r.ok) {
          b.textContent = '✅ تم! ستصلك النتيجة في المحادثة';
          setTimeout(() => { if (tg) tg.close(); }, 900);
          return;
        }
        throw new Error(r.error || 'error');
      } catch (e) {
        b.disabled = false;
        b.textContent = '✂️ قص وإرسال';
        $('formErr').textContent = 'تعذّر بدء القص، حاول مرة أخرى.';
      }
    };
  }

  function updatePreviewBtn() {
    $('preview').textContent = previewing ? '⏸ إيقاف المعاينة' : '▶ معاينة المقطع';
  }

  video.addEventListener('timeupdate', () => {
    if (dur) $('playhead').style.left = (video.currentTime / dur) * 100 + '%';
    if (previewing && video.currentTime >= end) { video.pause(); }
  });
  video.addEventListener('pause', () => { previewing = false; updatePreviewBtn(); });

  /* ---------- بدء الواجهة ---------- */
  function startUI(info) {
    if (uiStarted) return;
    const d = (isFinite(video.duration) && video.duration > 0) ? video.duration : info.duration;
    if (!d) return fail('تعذّر معرفة مدة الفيديو.');
    uiStarted = true;
    dur = d;
    start = 0;
    end = Math.min(dur, 60);
    if (end < 1) end = dur;
    $('title').textContent = info.title || '';
    $('total').textContent = fmt(dur);
    bindThumb($('tS'), 's');
    bindThumb($('tE'), 'e');
    bindButtons();
    $('loading').classList.add('hidden');
    $('main').classList.remove('hidden');
    render();
  }

  function ready(info) {
    video.addEventListener('loadedmetadata', () => startUI(info), { once: true });
    video.addEventListener('error', () => {
      // المعاينة غير مدعومة (صيغة الفيديو) لكن القص ما زال ممكناً بالأزرار
      startUI(info);
      $('formErr').textContent = 'المعاينة غير مدعومة لهذا الفيديو، استخدم الأزرار لضبط الوقت.';
    }, { once: true });
    video.src = '/media/' + encodeURIComponent(key);
    video.load();
  }

  async function poll() {
    try {
      const r = await fetch('/api/status?k=' + encodeURIComponent(key));
      const j = await r.json();
      if (j.state === 'ready') return ready(j);
      if (j.state === 'error') return fail(j.error || 'حدث خطأ أثناء تحميل الفيديو.');
      if (j.state === 'expired') return fail('انتهت صلاحية الطلب. أرسل الرابط للبوت مرة أخرى.');
    } catch (e) { /* نعيد المحاولة */ }
    setTimeout(poll, 1500);
  }

  async function begin() {
    $('loading').classList.remove('hidden');
    const r = await post('/api/prepare', { key: key });
    if (!r.ok) {
      const msgs = {
        expired: 'انتهت صلاحية هذا الطلب (أو أُعيد تشغيل البوت). أرسل الرابط للبوت مرة أخرى واضغط الزر الجديد.',
        bad_signature: 'فشل التحقق من تيليجرام. افتح الصفحة من زر البوت داخل تيليجرام.',
        wrong_user: 'هذا الطلب يخص مستخدماً آخر.',
      };
      return fail(msgs[r.error] || 'تعذّر فتح الطلب. أرسل الرابط للبوت مرة أخرى.');
    }
    poll();
  }

  /* ---------- الشاشة الرئيسية ---------- */
  function startHome() {
    $('home').classList.remove('hidden');
    const err = (m) => { $('homeErr').textContent = m || ''; };
    $('paste').onclick = () => {
      const put = (t) => { if (t) $('url').value = String(t).trim(); };
      if (tg && tg.readTextFromClipboard) tg.readTextFromClipboard(put);
      else if (navigator.clipboard) navigator.clipboard.readText().then(put).catch(() => {});
    };
    $('next').onclick = async () => {
      const url = $('url').value.trim();
      err('');
      if (!/^https?:\/\//i.test(url)) return err('الصق رابطاً صحيحاً يبدأ بـ https://');
      const b = $('next'); b.disabled = true; b.textContent = '⏳ جاري الفحص...';
      const r = await post('/api/create', { url: url });
      b.disabled = false; b.textContent = 'متابعة';
      if (!r.ok) {
        const m = { bad_url: 'الرابط غير صالح.', too_many: 'عندك طلبات كثيرة قيد المعالجة، انتظر قليلاً.',
                    bad_signature: 'افتح الصفحة من داخل تيليجرام.' };
        return err(m[r.error] || 'تعذّر قبول الرابط، حاول مرة أخرى.');
      }
      key = r.key;
      $('stepUrl').classList.add('hidden');
      $('stepPick').classList.remove('hidden');
    };
    const dl = async (action) => {
      err('');
      ['pV', 'pA', 'pT'].forEach((i) => { $(i).disabled = true; });
      const r = await post('/api/download', { key: key, action: action });
      if (r.ok) {
        $('stepPick').innerHTML = '<div class="center"><div style="font-size:42px">✅</div>' +
          '<div><b>تم! ستصلك النتيجة في المحادثة</b></div></div>';
        setTimeout(() => { if (tg) tg.close(); }, 1200);
      } else {
        ['pV', 'pA', 'pT'].forEach((i) => { $(i).disabled = false; });
        err('تعذّر بدء التحميل، حاول مرة أخرى.');
      }
    };
    $('pV').onclick = () => dl('video');
    $('pA').onclick = () => dl('audio');
    $('pT').onclick = () => { $('home').classList.add('hidden'); begin(); };
  }

  if (key) begin(); else startHome();
})();
</script>
</body>
</html>
